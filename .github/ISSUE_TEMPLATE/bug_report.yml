name: Bug report
description: Report a reproducible problem in Najm.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal code, repo, or steps to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Najm version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Bun
        - Node 20
        - Node 22
        - Other
    validations:
      required: true
